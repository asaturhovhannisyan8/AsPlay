
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AsPlay</title>

<style>
* {
    box-sizing: border-box;
}

.center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 40px);
}

.download-button {
    display: inline-block;
    margin-top: 25px;
    padding: 15px 25px;
    background: white;
    color: #066bb3;
    border-radius: 12px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background-image: url("обои пк.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
} 


/* Верхнее меню Liquid Glass */
.menu {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px;

    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    margin: 15px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
}

.menu button {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 18px;
    padding: 12px 20px;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.menu button:hover {
    background: rgba(255, 255, 255, 0.4);
    transform: translateY(-2px);
}
  

/* Основная часть */
.layout {
    position: relative;
    display: block;
    min-height: 100vh;
    padding: 20px;
}

.center {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 40px);
}

.sidebar {
    position: absolute;
    right: 20px;
    top: 20px;
    width: 260px;
}

/* Центральный блок */
.center {
    flex: 1;
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    background: #066bb3;
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    color: white;
}

.box h1 {
    font-size: 60px;
}

.box p {
    font-size: 30px;
}

/* Боковая панель */
  .sidebar {
      width: 300px;
      flex-shrink: 0;
  }

/* Блоки панели */
.panel {
    background: #147fb4;
    color: white;
    padding: 27px;
    margin-bottom: 25px;
    border-top: 4px solid #302078;
}

.panel h2 {
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 30px;
}

/* Поиск */
.search {
    width: 100%;
    padding: 15px 10px;
    font-size: 20px;
    border: 2px solid #ccc;
    outline: none;
}

/* Список публикаций */
.panel ul {
    padding-left: 23px;
}

.panel li {
    margin-bottom: 12px;
    font-size: 17px;
}

.panel a {
    color: white;
}

/* Архивы */
.panel select {
    width: 100%;
    padding: 5px;
    font-size: 18px;
}

/* Мобильная версия */
@media (max-width: 750px) {
    .layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
    }

    .center {
        width: 100%;
        min-height: 400px;
    }

    .box {
        padding: 30px;
    }

    .box h1 {
        font-size: 40px;
    }

    .box p {
        font-size: 22px;
    }
}
</style> 
</head>

<body>

<!-- Верхнее меню -->

</button>



</div>

</div>
