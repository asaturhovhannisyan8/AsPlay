
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AsPlay</title>

<style>
* {
    box-sizing: border-box;
}

/* Заставка загрузки */
#loader {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #101020;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    transition: opacity 0.7s ease, visibility 0.7s ease;
}

#loader h1 {
    font-size: 65px;
    color: #1696e8;
    text-shadow: 0 0 25px #1696e8;
    margin-bottom: 30px;
}

.loader-bar {
    width: 220px;
    height: 7px;
    background: #33334a;
    border-radius: 20px;
    overflow: hidden;
}

.loader-progress {
    width: 0%;
    height: 100%;
    background: #1696e8;
    border-radius: 20px;
    animation: loading 1.5s ease forwards;
}

#loader p {
    color: #aaa;
    font-size: 15px;
    margin-top: 15px;
}

#loader.hide {
    opacity: 0;
    visibility: hidden;
}

@keyframes loading {
    from { width: 0%; }
    to { width: 100%; }
}

/* Анимация кнопок */
button,
nav a {
    transition: all 0.25s ease;
    cursor: pointer;
    animation: buttonGlow 2s infinite;
}

button:hover,
nav a:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 5px 15px rgba(255,255,255,0.3);
}

button:active,
nav a:active {
    transform: scale(0.94);
}

@keyframes buttonGlow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
}

body {
    padding-top: 90px;
    margin: 0;
    font-family: Arial, sans-serif;
    background-image: url("обои пк.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
}

/* Верхнее меню */
.menu {
    position: fixed;
    top: 0;
    left: 0;
    width: calc(100% - 30px);
    z-index: 1000;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 20px;
    margin: 15px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}

.menu button {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    font-size: 18px;
    padding: 12px 20px;
    border-radius: 15px;
}

.menu button:hover {
    background: rgba(255,255,255,0.4);
    transform: translateY(-2px);
}

/* Контакты */
.contact-dropdown {
    position: absolute;
    right: 25px;
    top: 50%;
    transform: translateY(-50%);
}

.contact-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
}

.contact-menu {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 230px;
    padding: 8px;
    margin-top: 10px;
    background: rgba(30,30,30,0.9);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 14px;
    box-shadow: 0 8px 25px #0003;
    z-index: 1000;
}

.contact-menu a {
    display: block;
    padding: 12px;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.contact-menu a:hover {
    background: rgba(255,255,255,0.2);
}

.contact-menu.show {
    display: block;
}

/* Основная часть */
.layout {
    position: relative;
    min-height: 80vh;
    padding: 20px;
}

/* Центральный блок */
.center {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
}

.box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    color: white;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    text-shadow: 2px 2px 5px black;
}

.box h1 {
    font-size: 60px;
}

.box p {
    font-size: 30px;
}

/* Кнопка скачивания */
.download-button {
    display: inline-block;
    margin-top: 25px;
    padding: 15px 25px;
    background: white;
    color: #066bb3;
    border-radius: 12px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    text-shadow: none;
    box-shadow: none;
    transition: 0.2s;
}

.download-button:hover {
    transform: none;
    box-shadow: none;
}

.download-button:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #07528a,
                0 4px 8px rgba(0,0,0,0.5);
}

/* Боковая панель */
.sidebar {
    position: absolute;
    right: 20px;
    top: calc((80vh - 400px) / 2 + 85px);
    width: 310px;
}

.panel {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: white;
    padding: 27px;
    margin-bottom: 25px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}

.panel h2 {
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 30px;
}

.panel ul {
    padding-left: 23px;
}

.panel li {
    margin-bottom: 12px;
    font-size: 17px;
}

.panel a {
    color: white;
}


</style>
</head>

<body>
