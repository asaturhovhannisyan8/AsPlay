
<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>AsPlay</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-image: url("обои пк.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
}

/* Верхнее меню */
.menu {
    position: relative;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    margin: 15px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
}

.menu button {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    font-size: 18px;
    padding: 12px 20px;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.menu button:hover {
    background: rgba(255, 255, 255, 0.4);
    transform: translateY(-2px);
}

/* Контакты */
.contact-dropdown {
    position: absolute;
    right: 25px;
    top: 60%;
    transform: translateY(-50%);
}

.contact-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
}

.contact-menu {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 230px;
    padding: 8px;
    margin-top: 10px;
    background: rgba(30, 30, 30, 0.9);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 14px;
    box-shadow: 0 8px 25px #0003;
    z-index: 1000;
}

.contact-menu a {
    display: block;
    padding: 12px;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.contact-menu a:hover {
    background: rgba(255,255,255,0.2);
}

.contact-menu.show {
    display: block;
}

/* Основная часть */
.layout {
    position: relative;
    min-height: 80vh;
    padding: 20px;
}

/* Центральный блок */
.center {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
}

.box {
    background: #066bb3;
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    color: white;
}

.box h1 {
    font-size: 60px;
}

.box p {
    font-size: 30px;
}

.download-button {
    display: inline-block;
    margin-top: 25px;
    padding: 15px 25px;
    background: white;
    color: #066bb3;
    border-radius: 12px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

/* Боковая панель */
.sidebar {
    position: absolute;
    right: 20px;
    top: calc((80vh - 400px) / 2 + 85px);
    width: 310px;
}

.panel {
    background: #147fb4;
    color: white;
    padding: 27px;
    margin-bottom: 25px;
    border: none;
    border-radius: 18px;
    box-shadow: none;
}

.panel h2 {
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 30px;
}

.panel ul {
    padding-left: 23px;
}

.panel li {
    margin-bottom: 12px;
    font-size: 17px;
}

.panel a {
    color: white;
}

/* Мобильная версия */

@media (max-width: 750px) {

    .menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 20px;
    }

    .menu button {
        width: 100%;
        max-width: 320px;
        font-size: 17px;
    }

    .contact-dropdown {
        position: relative;
        top: auto;
        right: auto;
        transform: none;
        margin: 5px 0;
    }

    .layout {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 15px;
        min-height: auto;
    }

    .center {
        order: 1;
        width: 100%;
        min-height: 400px;
    }

    .box {
        width: 100%;
        padding: 30px 15px;
    }

    .box h1 {
        font-size: 40px;
    }

    .box p {
        font-size: 22px;
    }

    .sidebar {
        position: static;
        order: 2;
        width: 100%;
    }

    .panel {
        width: 100%;
        border-radius: 18px;
    }
} 
@media (max-width: 750px) {
    body {
        background-size: auto 100%;
        background-position: center top;
        background-attachment: scroll;
        background-repeat: repeat-y;
    }
}
/* Отдельный фон для телефона */

    }
} </style>
