
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsPlay Minecraft</title>

    <style>
        body {
            margin: 0;
            background: #171717;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #55ff55;
            margin-top: 100px;
            font-size: 45px;
        }

        .server-box {
            background: #292929;
            padding: 30px;
            width: 350px;
            margin: 40px auto;
            border-radius: 12px;
        }

        button {
            background: #55aa55;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* КНОПКА НАЗАД */
        .back-button {
            display: inline-block;
            position: absolute;
            top: 20px;
            left: 20px;
            background: #55aa55;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            background: #3d8b3d;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-button">⬅ Назад</a>

    <h1>Север друга и мой</h1>

    <div class="server-box"

    <p>Адрес сервера:</p>
    <h3 id="server-ip">AetherCraft1.aternos.me:62061</h3>

    <button onclick="navigator.clipboard.writeText('AetherCraft1.aternos.me:62061')">
        📋 Скопировать адрес
    </button>
</div>

</body>
</html>
